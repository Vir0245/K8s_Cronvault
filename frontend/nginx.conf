# Nginx config for the CronVault FRONTEND — HTTPS mode (cronvault.duckdns.org)
#
#  - :80  -> serves the ACME HTTP-01 challenge and redirects everything to HTTPS
#  - :443 -> serves the dashboard over TLS and reverse-proxies /api to the backend
# Certs live on the host at /etc/letsencrypt and are mounted read-only into the
# container (see docker-compose.frontend.yml).

# ---- HTTP :80 : ACME challenge + redirect to HTTPS ----
server {
    listen 80;
    server_name cronvault.duckdns.org;

    # Let's Encrypt HTTP-01 challenge files (certbot --webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Everything else -> HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS :443 : the real site ----
server {
    listen 443 ssl http2;
    server_name cronvault.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/cronvault.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cronvault.duckdns.org/privkey.pem;

    # Modern TLS defaults.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Static dashboard (dashboard.html placed as index.html).
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The dashboard uses relative /api/* calls; proxy them to the backend
    # over the private network (backend port 8010 is locked to the frontend SG).
    location /api/ {
        proxy_pass http://10.0.2.204:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
