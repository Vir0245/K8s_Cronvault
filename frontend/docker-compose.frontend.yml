services:
  nginx:
    image: nginx:1.27
    container_name: cronvault-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/usr/share/nginx/html:ro            # index.html (built from dashboard-redesigned) -> served as root
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
#      - /etc/letsencrypt:/etc/letsencrypt:ro    # TLS certs (issued by certbot on host)
#      - ./letsencrypt:/var/www/letsencrypt:ro   # ACME HTTP-01 webroot
    restart: unless-stopped
